[project]
name = "graphparity"
version = "0.1.0"
description = "A fairness-first benchmark harness comparing CognoDB against other graph database clouds."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "neo4j>=5.24",
    "python-arango>=8.1",
    "structlog>=24.4",
]

[project.scripts]
graphparity = "graphparity.runner:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.51",
]
