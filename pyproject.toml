[project]
name = "graphparity"
version = "0.1.0"
description = "A fairness-first benchmark harness comparing CognoDB against other graph database clouds."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "neo4j>=5.24",
    "python-arango>=8.1",
    "structlog>=24.4",
]

[project.scripts]
graphparity = "graphparity.runner:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.51",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no I/O, uses FakeGraphAdapter",
    "integration: hits a real database (CognoDB, AuraDB, or a local Docker instance)",
    "adapters: adapters/ -- one platform client per file",
    "workloads: workloads/ -- traversal, lookup, aggregation, mixed",
    "aggregate: aggregate.py -- p50/p95 computation and the results matrix",
]

[tool.coverage.run]
source = ["graphparity"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true
