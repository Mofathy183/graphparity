[pytest]
pythonpath = . src
testpaths = src tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

addopts = -ra --strict-markers

markers =
    unit: fast, no I/O, uses FakeGraphAdapter
    integration: hits a real database (CognoDB, AuraDB, or a local Docker instance)
    errors: errors/ -- ErrorCode and BenchmarkError, the shared failure vocabulary
    config: config/ -- PlatformConfig validation
    adapters: adapters/ -- one platform client per file
    workloads: workloads/ -- traversal, lookup, aggregation, mixed
    aggregate: aggregate.py -- p50/p95 computation and the results matrix